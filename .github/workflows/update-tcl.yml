name: Update TCL.m3u

on:
  workflow_dispatch:

  schedule:
    # 3 keer per dag
    - cron: "17 0,8,16 * * *"

permissions:
  contents: write

concurrency:
  group: tcl-generator
  cancel-in-progress: true

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      - name: Install dependencies

        run: |

          python -m pip install \
            --disable-pip-version-check \
            requests


      - name: Generate TCL.m3u

        run: |

          python generator.py


      - name: Commit changes

        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            TCL.m3u \
            .tcl-auto.json


          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "Auto-update TCL.m3u"

            git push

          fi
