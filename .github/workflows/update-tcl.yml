name: Update TCL.m3u

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours. 03/09/15/21 UTC avoids the top of the hour.
    - cron: "17 3,9,15,21 * * *"

permissions:
  contents: write

concurrency:
  group: tcl-m3u-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Synchronise TCL.m3u
        env:
          CHECK_STREAMS: "true"
          CHECK_WORKERS: "24"
          CHECK_TIMEOUT: "8"
          MAX_NEW_STREAMS: "500"
        run: python sync_tcl.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add TCL.m3u .tcl-auto.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-update TCL.m3u streams"
          git push
